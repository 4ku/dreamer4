# Dreamer 4 — Cartpole-balance config
# Increased capacity for sharper world model predictions.

# -- Environment --
domain: cartpole
task: balance
image_size: 64
action_repeat: 2
n_envs: 4
time_limit: 250

# -- Tokenizer --
patch_size: 8
channels: 3
d_bottleneck: 32
n_bottleneck: 64
packing_k: 4
tokenizer_lr: 3.0e-4

# -- Dynamics --
d_model: 256
d_spatial: 128
n_spatial: 16
n_register: 2
n_agent: 1
n_heads: 4
depth: 4
k_max: 4
dynamics_lr: 3.0e-4
bootstrap_fraction: 0.25

# -- Agent heads --
mtp_length: 2
policy_mlp_depth: 2
policy_mlp_ratio: 2.0
reward_num_bins: 255
value_num_bins: 255
bin_low: -5.0
bin_high: 5.0
agent_lr: 3.0e-4
policy_lr: 3.0e-4
policy_min_std: 0.3
policy_max_std: 2.0
num_tasks: 1

# -- Imagination --
imagination_horizon: 32
imagination_K: 4
imagination_tau_ctx: 0.1
imagination_ctx_len: 8
gamma: 0.97
lam: 0.95

# -- PMPO --
pmpo_alpha: 0.5
pmpo_beta: 0.3
entropy_scale: 3.0e-2

# -- Policy inference --
policy_max_context: 8
inference_tau: 0.95
expl_noise: 0.3

# -- Training loop --
total_steps: 2000000
prefill_steps: 5000
train_every: 8
batch_size: 24
seq_len: 16
wm_train_steps: 4
imagine_train_steps: 4
replay_capacity: 500000
max_grad_norm: 100.0
policy_max_grad_norm: 10.0
prior_update_interval: 200
prior_warmup_steps: 1000

# -- Checkpointing --
checkpoint_every: 3000
keep_last_n: 40

# -- Logging --
log_every: 25
eval_every: 2000
wm_video_every: 20000

device: cuda
