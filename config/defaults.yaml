# Dreamer 4 — Default configuration
# All values match TrainConfig dataclass defaults.

# -- Environment --
domain: cartpole
task: swingup
image_size: 64
action_repeat: 2
n_envs: 1
time_limit: 500

# -- Tokenizer --
patch_size: 8
channels: 3
d_bottleneck: 16
n_bottleneck: 64
packing_k: 4
tokenizer_lr: 3.0e-4

# -- Dynamics --
d_model: 256
d_spatial: 64
n_spatial: 16
n_register: 4
n_agent: 2
n_heads: 4
depth: 8
k_max: 4
dynamics_lr: 1.0e-4
bootstrap_fraction: 0.25

# -- Agent heads --
mtp_length: 8
policy_mlp_depth: 2
policy_mlp_ratio: 2.0
reward_num_bins: 127
value_num_bins: 127
agent_lr: 3.0e-4
num_tasks: 1

# -- Imagination --
imagination_horizon: 15
imagination_K: 4
imagination_tau_ctx: 0.1
imagination_ctx_len: 4
gamma: 0.997
lam: 0.95

# -- PMPO (Eq. 11) --
pmpo_alpha: 0.5
pmpo_beta: 0.3

# -- Policy inference --
policy_max_context: 8
inference_tau: 0.95

# -- Training loop --
total_steps: 1000000
prefill_steps: 5000
train_every: 16
batch_size: 16
seq_len: 16
wm_train_steps: 1
imagine_train_steps: 1
replay_capacity: 1000000
max_grad_norm: 100.0
prior_update_interval: 100
prior_update_interval: 100

# -- Checkpointing --
checkpoint_every: 10000
keep_last_n: 3

# -- Logging --
log_every: 100
eval_every: 10000

device: cuda
