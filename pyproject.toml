[project]
name = "dreamer4-pytorch"
version = "0.1.0"
description = "Dreamer 4 — PyTorch implementation of a scalable world model agent"
requires-python = ">=3.10"

dependencies = [
    # Core
    "torch>=2.2",
    # Config
    "pyyaml",
    # Utilities
    "numpy",
    "einops",
    # Visualization
    "matplotlib",
    "torchvision",
    "lpips",
    # TensorBoard logging
    "tensorboard",
    # Video writing
    "imageio",
    "imageio-ffmpeg",
    "moviepy",
    # Testing
    "pytest",
]

[project.scripts]
dreamer4-train-tokenizer = "dreamer4.train.train_tokenizer:main"
dreamer4-train-dynamics = "dreamer4.train.train_dynamics:main"

[project.optional-dependencies]
dino = [
    # DINOv3 perceptual loss backbone (dreamer4.perceptual.DinoV3Perceptual)
    "transformers",
]
lerobot = [
    # parquet reading for LeRobot state/actions (dreamer4.data.lerobot)
    "pyarrow",
]
envs = [
    # Environments — install separately: uv pip install -e ".[envs]"
    # Requires Python <=3.12 for pre-built mujoco/labmaze wheels.
    "dm_control",
    "gymnasium",
]
interactive = [
    "pygame",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dreamer4*"]
